# Nuxt 服务端（.output/server/index.mjs）的反向代理配置。
#
# 三个必须写对的地方，都是踩过才会知道的：
#   ① `proxy_buffering off` —— Nuxt 的 SSE / 流式渲染会被 nginx 缓冲，
#      表现是「实时进度变成结束后一次性出现」「流式首屏失效」。默认是 on。
#   ② `client_max_body_size` —— 默认 1m，文件上传会直接被 413 掉，且错误来自 nginx 而非应用。
#   ③ `proxy_set_header X-Forwarded-*` —— 不加的话应用看到的来源 IP 永远是 nginx 容器地址，
#      限流与审计全部失效。
#
# 注意：本文件只处理 HTTP。HTTPS 建议在更外层（云负载均衡或 certbot 版配置）终止，
# 免得证书在容器里到处都是。

upstream nuxt_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传体积：按你的业务调整。忘了改的症状是「上传大文件报 413，日志里没有应用记录」。
    client_max_body_size 20m;

    # 压缩交给 nginx：Node 侧再做一次是重复劳动，而且 nginx 的 gzip 更省 CPU。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带 hash，可以放心长缓存。
    location /_nuxt/ {
        proxy_pass http://nuxt_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查不记日志：探针每 30 秒一次，写日志只会把有用信息冲掉。
    location = /api/health {
        proxy_pass http://nuxt_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        access_log off;
    }

    location / {
        proxy_pass http://nuxt_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上游长连接：不对每个请求重建 TCP 连接
        proxy_set_header Connection '';

        # 流式渲染 / SSE 的关键一行。默认 on 会缓冲整段响应，
        # 于是「流式」在浏览器侧完全看不出效果。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 服务端渲染偶发慢请求时的超时口径
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
